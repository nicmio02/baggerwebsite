<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Projectoverzicht van Blauwe Bagger met samenwerkingen, praktijktesten en R&D rond circulaire baggerverwerking."
    />
    <title>Blauwe Bagger | Projecten</title>
    <link rel="icon" href="assets/brand/blauwe-bagger-icon.png" />
    <link rel="preload" href="assets/brand/blauwe-bagger-logo.svg" as="image" />
    <link rel="stylesheet" href="styles.css?v=nav-motion" />
  </head>
  <body data-page="projecten">
    <a class="skip-link" href="#main">Ga naar inhoud</a>
    <header class="site-header" data-header>
      <div class="nav-shell">
        <a class="brand-link" href="/" aria-label="Blauwe Bagger home">
          <img class="brand-link__icon" src="assets/brand/blauwe-bagger-icon.png" alt="Blauwe Bagger" />
        </a>

        <nav class="main-nav" aria-label="Hoofdnavigatie">
          <a href="/#home-missie">Het Plan</a>
          <a href="/services">Services</a>
          <a class="is-current" href="/projecten">Projecten</a>
          <a href="/over-ons">Over ons</a>
        </nav>

        <div class="nav-actions">
          <a class="icon-button icon-button--desktop" href="/contact" aria-label="Neem contact op">
            <span>Neem contact op</span>
            <svg class="icon-button__people" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M8 11a3.25 3.25 0 1 0 0-6.5A3.25 3.25 0 0 0 8 11Z" />
              <path d="M16.75 10.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" />
              <path d="M3.75 18v-.35A4.65 4.65 0 0 1 8.4 13h1.2a4.65 4.65 0 0 1 4.65 4.65V18" />
              <path d="M14.6 13.85a3.9 3.9 0 0 1 3.15-1.6h.35A2.9 2.9 0 0 1 21 15.15V18" />
            </svg>
          </a>
          <button class="menu-toggle" type="button" aria-controls="mobile-menu" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
            <span class="sr-only">Menu</span>
          </button>
        </div>
      </div>

      <nav class="mobile-menu" id="mobile-menu" aria-label="Mobiele navigatie" hidden>
        <a href="/services">Services</a>
        <a href="/producten">Producten</a>
        <a class="is-current" href="/projecten">Projecten</a>
        <a href="/over-ons">Over ons</a>
        <a href="/contact">Neem contact op</a>
      </nav>
    </header>

    <main id="main">
      <section class="project-board-section project-board-section--index" id="project-board" aria-labelledby="project-board-title">
        <div class="section-inner" data-project-feed>
          <p class="project-board-kicker reveal">Projectoverzicht</p>
          <h1 id="project-board-title" class="project-board-title reveal">Projecten</h1>

          <div class="project-board" data-project-board>
            <div class="detail-loading">Projecten worden geladen...</div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="section-inner footer-grid">
        <a class="brand-link" href="/" aria-label="Blauwe Bagger home">
          <img class="brand-link__icon" src="assets/brand/blauwe-bagger-icon.png" alt="Blauwe Bagger" />
        </a>
        <nav aria-label="Footer navigatie">
          <a href="/services">Services</a>
          <a href="/producten">Producten</a>
          <a class="is-current" href="/projecten">Projecten</a>
          <a href="/over-ons">Over ons</a>
          <a href="/contact">Contact</a>
        </nav>
      </div>
    </footer>

    <script src="script.js?v=lang-switch"></script>
    <script src="projects.js"></script>
  </body>
</html>
